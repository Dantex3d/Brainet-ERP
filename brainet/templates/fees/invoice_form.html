{% extends 'dashboards/base.html' %}

{% block content %}
<div class="container py-4">
    <!-- SCHOOL HEADER WITH LOGO -->
    {% if school and school.logo %}
    <div class="row mb-4">
        <div class="col-lg-12">
            <div class="card border-0 shadow-lg rounded-4">
                <div class="card-body p-3">
                    <div class="d-flex align-items-center gap-3">
                        <img src="{{ school.logo.url }}" alt="{{ school.name }}" style="max-height: 60px; max-width: 60px; object-fit: contain;">
                        <div>
                            <h5 class="fw-bold text-primary mb-0">{{ school.name }}</h5>
                            {% if school.motto %}<small class="text-muted fst-italic">{{ school.motto }}</small>{% endif %}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    {% endif %}

    <div class="row mb-4">
        <div class="col-lg-8">
            <a href="{% url 'fees_dashboard' %}" class="btn btn-outline-secondary rounded-3 mb-3">← Back to Fees</a>
            <h1 class="fw-bold text-primary">Create Invoice</h1>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-8">
            <div class="card border-0 shadow-lg rounded-4">
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}

                        {% if school %}
                        <input type="hidden" name="school" value="{{ school.id }}">
                        {% else %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">School</label>
                            <select name="school" class="form-select rounded-3" required>
                                <option value="">-- Select School --</option>
                                {% for s in schools %}
                                <option value="{{ s.id }}">{{ s.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        {% endif %}

                        <div class="mb-3">
                            <label class="form-label fw-bold">Fee Structure (Optional)</label>
                            <select name="structure" class="form-select rounded-3">
                                <option value="">-- Select Structure --</option>
                                {% for struct in structures %}
                                <option value="{{ struct.id }}">{{ struct.title }} ({{ struct.school.name }}) - KES {{ struct.total_amount }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Payer Name</label>
                            <input type="text" name="payer_name" class="form-control rounded-3" placeholder="Student name or guardian name" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Description (Optional)</label>
                            <textarea name="description" class="form-control rounded-3" rows="3" placeholder="Invoice details, what fees are for, etc."></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Amount (KES)</label>
                            <input type="number" name="amount" class="form-control rounded-3" step="0.01" min="0" placeholder="26500" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Due Date (Optional)</label>
                            <input type="date" name="due_date" class="form-control rounded-3">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Payment Method</label>
                            <select name="payment_method" class="form-select rounded-3">
                                <option value="mpesa">M-Pesa</option>
                                <option value="bank">Bank Transfer</option>
                                <option value="cash">Cash</option>
                                <option value="other">Other</option>
                            </select>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary btn-lg rounded-3">✓ Create Invoice</button>
                            <a href="{% url 'fees_dashboard' %}" class="btn btn-outline-secondary btn-lg rounded-3">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
