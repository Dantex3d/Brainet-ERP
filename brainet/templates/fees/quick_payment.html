{% extends 'dashboards/base.html' %}

{% block content %}
<div class="container py-4">
    <div class="row mb-4">
        <div class="col-lg-8">
            <a href="{% url 'fees_dashboard' %}" class="btn btn-outline-secondary rounded-3 mb-3">← Back to Fees</a>
            <h1 class="fw-bold text-primary">Quick Payment</h1>
            <p class="text-muted">Record a direct payment using student's admission number.</p>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-6">
            <div class="card border-0 shadow-lg rounded-4">
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">Admission Number</label>
                            <input id="admission_number_input" type="text" name="admission_number" class="form-control rounded-3" required placeholder="e.g. ADM00123">
                            <div id="lookup-feedback" class="mb-2 text-danger" style="display:none;"></div>
                        </div>

                        <div id="student-details" style="display:none;" class="mb-3 p-3 rounded-4 bg-light border">
                            <strong>Student found:</strong>
                            <div class="mt-2"><strong>Name:</strong> <span id="sd-name"></span></div>
                            <div><strong>Admission #:</strong> <span id="sd-adm"></span></div>
                            <div><strong>Class:</strong> <span id="sd-class"></span></div>
                            <div><strong>Stream:</strong> <span id="sd-stream"></span></div>
                            <div><strong>Parent / Guardian:</strong> <span id="sd-parent"></span></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Term</label>
                            <select name="term" class="form-select rounded-3">
                                <option value="">-- Select Term --</option>
                                {% for t in terms %}
                                <option value="{{ t.name }}">{{ t.name }} ({{ t.start_date }} - {{ t.end_date }})</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Amount (KES)</label>
                            <input type="number" name="amount" class="form-control rounded-3" step="0.01" min="0" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Payment Method</label>
                            <select name="payment_method" class="form-select rounded-3">
                                <option value="cash">Cash</option>
                                <option value="mpesa">M-Pesa</option>
                                <option value="bank">Bank</option>
                                <option value="other">Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Reference (optional)</label>
                            <input type="text" name="payment_reference" class="form-control rounded-3" placeholder="Transaction reference for bank or mpesa">
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Record Payment & Print Receipt</button>
                            <a href="{% url 'fees_dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const admissionInput = document.getElementById('admission_number_input');
    const feedback = document.getElementById('lookup-feedback');
    const studentDetails = document.getElementById('student-details');
    const sdName = document.getElementById('sd-name');
    const sdAdm = document.getElementById('sd-adm');
    const sdClass = document.getElementById('sd-class');
    const sdStream = document.getElementById('sd-stream');
    const sdParent = document.getElementById('sd-parent');

    function renderStudent(data) {
        sdName.textContent = data.name || '';
        sdAdm.textContent = data.admission_number || '';
        sdClass.textContent = data.class || 'N/A';
        sdStream.textContent = data.stream || 'N/A';
        sdParent.textContent = data.parent_phone || 'Not provided';
        studentDetails.style.display = 'block';
        feedback.style.display = 'none';
    }

    function clearStudent() {
        sdName.textContent = '';
        sdAdm.textContent = '';
        sdClass.textContent = '';
        sdStream.textContent = '';
        sdParent.textContent = '';
        studentDetails.style.display = 'none';
    }

    let timeout;
    admissionInput.addEventListener('input', function () {
        clearTimeout(timeout);
        const value = admissionInput.value.trim();
        if (!value) {
            feedback.style.display = 'none';
            clearStudent();
            return;
        }
        timeout = setTimeout(function () {
            fetch(`{% url 'student_lookup' %}?admission_number=${encodeURIComponent(value)}`)
                .then(async function (resp) {
                    const data = await resp.json();
                    if (!resp.ok || !data.ok) {
                        feedback.textContent = data.message || 'Student not found.';
                        feedback.style.display = 'block';
                        clearStudent();
                        return;
                    }
                    renderStudent(data.student);
                    // Prefill payer name and amount if needed
                    const payer = document.querySelector('input[name="payer_name"]');
                    if (payer && !payer.value.trim()) payer.value = data.student.name;
                })
                .catch(function () {
                    feedback.textContent = 'Lookup failed. Please try again.';
                    feedback.style.display = 'block';
                    clearStudent();
                });
        }, 350);
    });
});
</script>

{% endblock %}
