<form method="POST" action="/schools/principal/save-marks/">
    {% csrf_token %}

    <input type="hidden" name="class_subject" value="{{ class_subject.id }}">
    <input type="hidden" name="term" value="{{ term.id }}">

    <table border="1">
        <tr>
            <th>Student</th>
            <th>Marks</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student.name }}</td>
            <td>
                <input type="number"
                       name="student_{{ student.id }}"
                       step="0.1"
                       required>
            </td>
        </tr>
        {% endfor %}
    </table>

    <button type="submit">Save Marks</button>
</form>
