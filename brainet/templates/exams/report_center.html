{% extends 'dashboards/base.html' %}

{% block content %}

<div class="container py-4">

    <div class="card shadow rounded-4 border-0">

        <div class="card-header bg-primary text-white">

            <h4 class="mb-0">
                Report Form Generator
            </h4>

        </div>

        <div class="card-body">

            <!-- CLASS FILTER -->
            <form method="get" class="row g-3 mb-4">

                <div class="col-md-6">

                    <label class="form-label">
                        Select Class
                    </label>

                    <select name="class_id"
                            class="form-select"
                            onchange="this.form.submit()">

                        <option value="">
                            Choose Class
                        </option>

                        {% for c in classes %}

                        <option value="{{ c.id }}"
                            {% if request.GET.class_id == c.id|stringformat:"s" %}
                                selected
                            {% endif %}>

                            {{ c.name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

            </form>

            <!-- STUDENTS -->
            {% if students %}

            <div class="table-responsive">

                <table class="table table-hover">

                    <thead>

                        <tr>

                            <th>Student</th>
                            <th>Admission</th>
                            <th>Generate</th>

                        </tr>

                    </thead>

                    <tbody>

                        {% for student in students %}

                        <tr>

                            <td>
                                {{ student.full_name }}
                            </td>

                            <td>
                                {{ student.admission_number }}
                            </td>

                            <td>

                                <form method="get"
                                      action="{% url 'generate_report_forms' student.id %}">

                                    <div class="d-flex gap-2">

                                        <select name="exam_id"
                                                class="form-select">

                                            {% for exam in exams %}

                                            <option value="{{ exam.id }}">

                                                {{ exam.name }}

                                            </option>

                                            {% endfor %}

                                        </select>

                                        <button type="submit"
                                                class="btn btn-success">

                                            Generate

                                        </button>

                                    </div>

                                </form>

                            </td>

                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>

            {% endif %}

        </div>

    </div>

</div>

{% endblock %}
