<!DOCTYPE html>
<html>
<head>

    <title>Edit Grading</title>

    <style>

        body{
            font-family: Arial;
            background: #f4f6f9;
            padding: 30px;
        }

        .card{
            width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        input{
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button{
            padding: 10px 20px;
            background: #1e3a8a;
            color: white;
            border: none;
            border-radius: 5px;
        }

    </style>

</head>

<body>

<div class="card">

    <h1>Edit Grading</h1>

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="grade_letter"
            value="{{ grading.grade_letter }}"
            required
        >

        <input
            type="text"
            name="short_form"
            value="{{ grading.short_form }}"
        >

        <input
            type="number"
            name="min_score"
            value="{{ grading.min_score }}"
            required
        >

        <input
            type="number"
            name="max_score"
            value="{{ grading.max_score }}"
            required
        >

        <input
            type="number"
            step="0.1"
            name="points"
            value="{{ grading.points }}"
        >

        <input
            type="text"
            name="remarks"
            value="{{ grading.remarks }}"
        >

        <button type="submit">
            Update Grading
        </button>

    </form>

</div>

</body>
</html>
