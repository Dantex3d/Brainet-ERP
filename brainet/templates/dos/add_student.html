{% extends 'dashboards/base.html' %}

{% block content %}

<div class="container py-4">

    <div class="card shadow rounded-4">

        <div class="card-header bg-primary text-white">
            <h4>Add Student</h4>
        </div>

        <div class="card-body">

            <form method="post">
                {% csrf_token %}

                <!-- NAME -->
                <input type="text"
                       name="name"
                       class="form-control mb-3"
                       placeholder="Student Name"
                       required>

                <!-- ADMISSION NUMBER -->
                <input type="text"
                       name="admission_number"
                       class="form-control mb-3"
                       placeholder="Admission Number"
                       required>

                <!-- GENDER -->
                <select name="gender"
                        class="form-control mb-3">

                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>

                </select>

                <!-- CLASS -->
                <select name="class_id"
                        class="form-control mb-3"
                        id="classSelect">

                    <option value="">Select Class</option>

                    {% for c in classes %}
                        <option value="{{ c.id }}">{{ c.name }} ({{ c.level }})</option>
                    {% endfor %}

                </select>

                <!-- STREAM -->
                <select name="stream_id"
                        class="form-control mb-3"
                        id="streamSelect">

                    <option value="">Select Stream (optional)</option>

                    {% for s in streams %}
                        <option value="{{ s.id }}"
                                data-class="{{ s.class_group.id }}">
                            {{ s.class_group.name }} - {{ s.name }}
                        </option>
                    {% endfor %}

                </select>

                <!-- DORM -->
                <select name="dorm_id"
                        class="form-control mb-3">

                    <option value="">Select Dorm (optional)</option>

                    {% for d in dorms %}
                        <option value="{{ d.id }}">{{ d.name }}</option>
                    {% endfor %}

                </select>

                <!-- SUBMIT -->
                <button class="btn btn-success w-100">
                    Save Student
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}

{% block extra_js %}
<script>
// Filter streams based on selected class
const classSelect = document.getElementById("classSelect");
const streamSelect = document.getElementById("streamSelect");

if (classSelect && streamSelect) {
    classSelect.addEventListener("change", function () {
        const classId = this.value;

        Array.from(streamSelect.options).forEach(opt => {
            if (!opt.dataset.class) return;

            opt.style.display =
                !classId || opt.dataset.class === classId
                ? ""
                : "none";
        });

        streamSelect.value = "";
    });
}
</script>
{% endblock %}
