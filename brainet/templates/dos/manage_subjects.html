<!DOCTYPE html>
<html>
<head>
    <title>Manage Subjects</title>

    <style>

        body{
            font-family: Arial;
            background: #f5f7fb;
            margin: 0;
            padding: 20px;
        }

        .container{
            width: 95%;
            margin: auto;
        }

        .card{
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1{
            margin-top: 0;
            color: #1e3a8a;
        }

        form{
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input{
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            min-width: 200px;
        }

        button{
            padding: 10px 20px;
            background: #1e3a8a;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background: #162d63;
        }

        table{
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
        }

        table th{
            background: #1e3a8a;
            color: white;
            padding: 12px;
            text-align: left;
        }

        table td{
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .btn-edit{
            background: green;
            padding: 8px 12px;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn-delete{
            background: red;
            padding: 8px 12px;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .messages{
            margin-bottom: 20px;
        }

        .message{
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            background: #d1fae5;
            color: #065f46;
        }

    </style>

</head>
<body>

<div class="container">

    <div class="card">

        <h1>Manage Subjects</h1>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST" action="{% url 'add_subject' %}">
            {% csrf_token %}

            <input
                type="text"
                name="name"
                placeholder="Subject Name"
                required
            >

            <input
                type="text"
                name="code"
                placeholder="Subject Code"
            >

            <button type="submit">
                Add Subject
            </button>

        </form>

    </div>

    <div class="card">

        <table>

            <thead>
                <tr>
                    <th>#</th>
                    <th>Subject</th>
                    <th>Code</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>

                {% for subject in subjects %}

                <tr>

                    <td>
                        {{ forloop.counter }}
                    </td>

                    <td>
                        {{ subject.name }}
                    </td>

                    <td>
                        {{ subject.code }}
                    </td>

                    <td>

                        <a
                            href="{% url 'edit_subject' subject.id %}"
                            class="btn-edit"
                        >
                            Edit
                        </a>

                        <a
                            href="{% url 'delete_subject' subject.id %}"
                            class="btn-delete"
                            onclick="return confirm('Delete this subject?')"
                        >
                            Delete
                        </a>

                    </td>

                </tr>

                {% empty %}

                <tr>
                    <td colspan="4">
                        No subjects added yet.
                    </td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
