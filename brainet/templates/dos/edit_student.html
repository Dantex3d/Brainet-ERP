{% extends 'dashboards/base.html' %}

{% block content %}
<div class="container-fluid py-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold text-primary mb-1">Edit Student</h3>
        <a href="{% url 'manage_students' %}" class="btn btn-outline-dark">← Back</a>
    </div>

    <!-- EDIT FORM -->
    <div class="card shadow rounded-4">
        <div class="card-header bg-primary text-white">
            <strong>Update Student Information</strong>
        </div>

        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="row g-3">

                    <!-- Name -->
                    <div class="col-md-6">
                        <label class="text-muted">Full Name</label>
                        <input type="text" name="name" class="form-control" value="{{ student.name }}" required>
                    </div>

                    <!-- Admission Number -->
                    <div class="col-md-6">
                        <label class="text-muted">Admission Number</label>
                        <input type="text" name="admission_number" class="form-control" value="{{ student.admission_number }}" required>
                    </div>

                    <!-- Gender -->
                    <div class="col-md-6">
                        <label class="text-muted">Gender</label>
                        <select name="gender" class="form-select">
                            <option value="Male" {% if student.gender == 'Male' %}selected{% endif %}>Male</option>
                            <option value="Female" {% if student.gender == 'Female' %}selected{% endif %}>Female</option>
                        </select>
                    </div>

                    <!-- Class -->
                    <div class="col-md-6">
                        <label class="text-muted">Class</label>
                        <select name="class_id" id="editClassSelect" class="form-select" required>
                            <option value="">-- Select Class --</option>
                            {% for c in classes %}
                                <option value="{{ c.id }}" {% if student.current_class and student.current_class.id == c.id %}selected{% endif %}>
                                    {{ c.name }} ({{ c.level }})
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Stream -->
                    <div class="col-md-6">
                        <label class="text-muted">Stream</label>
                        <select name="stream_id" id="editStreamSelect" class="form-select">
                            <option value="">-- Select Stream (optional) --</option>
                            {% for stream in streams %}
                                <option value="{{ stream.id }}" data-class="{{ stream.class_group.id }}"
                                    {% if student.stream and student.stream.id == stream.id %}selected{% endif %}>
                                    {{ stream.class_group.name }} - {{ stream.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Dormitory -->
                    <div class="col-md-6">
                        <label class="text-muted">Dormitory</label>
                        <select name="dormitory_id" class="form-select">
                            <option value="">-- Select Dorm (optional) --</option>
                            {% for dorm in dorms %}
                                <option value="{{ dorm.id }}" {% if student.dormitory and student.dormitory.id == dorm.id %}selected{% endif %}>
                                    {{ dorm.name }}{% if dorm.capacity %} (Capacity: {{ dorm.capacity }}){% endif %}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                </div>

                <div class="mt-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{% url 'manage_students' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

</div>
{% endblock %}

{% block extra_js %}
<script>
// Filter streams in edit form based on selected class
const editClass = document.getElementById('editClassSelect');
const editStream = document.getElementById('editStreamSelect');
if(editClass && editStream){
    function filterEditStreams(){
        const cid = editClass.value;
        Array.from(editStream.options).forEach(function(opt){
            if(!opt.dataset.class) return;
            opt.style.display = (!cid || opt.dataset.class === cid) ? '' : 'none';
        });
        if(editStream.selectedOptions.length){
            const sel = editStream.selectedOptions[0];
            if(sel && sel.dataset.class !== cid) editStream.value = '';
        }
    }
    editClass.addEventListener('change', filterEditStreams);
    filterEditStreams();
}
</script>
{% endblock %}
