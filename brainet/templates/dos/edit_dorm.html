{% extends 'dashboards/base.html' %}
{% load static %}

{% block content %}
<div class="container-fluid py-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-info mb-1">Edit Dormitory</h2>
        <a href="{% url 'manage_dorms' %}" class="btn btn-outline-dark shadow-sm">
            ← Back to Dorms
        </a>
    </div>

    <!-- EDIT FORM -->
    <div class="card border-0 shadow-lg rounded-4">
        <div class="card-header bg-info text-white rounded-top-4">
            <h5 class="mb-0">Update Dormitory Information</h5>
        </div>

        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="row g-3">

                    <!-- Dorm Name -->
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted">Dormitory Name</label>
                        <input type="text" name="name" class="form-control"
                               value="{{ dorm.name }}" required>
                    </div>

                    <!-- Capacity -->
                    <div class="col-md-3">
                        <label class="form-label fw-bold text-muted">Capacity</label>
                        <input type="number" name="capacity" class="form-control"
                               value="{{ dorm.capacity|default:'' }}" placeholder="e.g. 50">
                    </div>

                    <!-- Supervisor -->
                    <div class="col-md-3">
                        <label class="form-label fw-bold text-muted">Supervisor</label>
                        <input type="text" name="supervisor" class="form-control"
                               value="{{ dorm.supervisor|default:'' }}" placeholder="Supervisor Name">
                    </div>

                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-info">💾 Save Changes</button>
                    <a href="{% url 'manage_dorms' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

</div>
{% endblock %}
