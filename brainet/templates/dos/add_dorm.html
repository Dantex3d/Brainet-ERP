{% extends 'dashboards/base.html' %}
{% load static %}

{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-warning">Add Dormitory</h2>
        <a href="{% url 'manage_dorms' %}" class="btn btn-outline-dark shadow-sm">← Back to Dorms</a>
    </div>

    <div class="card border-0 shadow-lg rounded-4">
        <div class="card-header bg-warning text-dark rounded-top-4">
            <h5 class="mb-0">Dormitory Details</h5>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted">Dormitory Name</label>
                        <input type="text" name="name" class="form-control" placeholder="Example: Mandela Dorm" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold text-muted">Capacity</label>
                        <input type="number" name="capacity" class="form-control" placeholder="e.g. 50">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold text-muted">Supervisor</label>
                        <input type="text" name="supervisor" class="form-control" placeholder="Supervisor Name">
                    </div>
                </div>
                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-warning">➕ Add Dorm</button>
                    <a href="{% url 'manage_dorms' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
