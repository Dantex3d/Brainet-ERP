<!DOCTYPE html>
<html>
<head>
    <title>Class List Print</title>
    <style>
        body { font-family: Arial; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #000; padding: 8px; }
        th { background: #eee; }
    </style>
</head>

<body onload="window.print()">

    <h2>{{ class_obj.name }} - Class List</h2>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Admission Number</th>
                <th>Gender</th>
            </tr>
        </thead>

        <tbody>
            {% for s in students %}
            <tr>
                <td>{{ s.name }}</td>
                <td>{{ s.admission_number }}</td>
                <td>{{ s.gender }}</td>
            </tr>
            {% endfor %}
        </tbody>

    </table>

</body>
</html>
