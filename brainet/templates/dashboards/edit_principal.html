{% extends 'dashboards/base.html' %}
{% load static %}

{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
        <div>
            <h3 class="fw-bold mb-1">👨‍💼 Edit Principal</h3>
            <p class="text-muted mb-0">Update the principal account and linked login details.</p>
        </div>
        <a href="{% url 'manage_principals' %}" class="btn btn-outline-secondary rounded-3">← Back to Principal Manager</a>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-lg rounded-4">
                <div class="card-header bg-primary text-white rounded-top-4">
                    <h5 class="mb-0">Principal Details</h5>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Full Name</label>
                                <input type="text" name="name" class="form-control rounded-3" value="{{ principal.name }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Email</label>
                                <input type="email" name="email" class="form-control rounded-3" value="{{ principal.email }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Phone</label>
                                <input type="text" name="phone" class="form-control rounded-3" value="{{ principal.phone }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">School</label>
                                <select name="school" class="form-select rounded-3" required>
                                    {% for school in schools %}
                                    <option value="{{ school.id }}" {% if school.id == principal.school_id %}selected{% endif %}>{{ school.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-12 mb-3">
                                <label class="form-label fw-bold">New Password</label>
                                <input type="password" name="password" class="form-control rounded-3" placeholder="Leave blank to keep current password">
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center gap-2">
                            <a href="{% url 'manage_principals' %}" class="btn btn-outline-secondary rounded-3">Cancel</a>
                            <button type="submit" class="btn btn-primary rounded-3">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
