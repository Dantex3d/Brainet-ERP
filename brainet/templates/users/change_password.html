{% extends 'dashboards/base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow rounded-4">
                <div class="card-body p-4">
                    <h3 class="mb-3">Change your password</h3>
                    <p class="text-muted">For security, please choose a new password before continuing.</p>
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} rounded-3">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary rounded-3">Update Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
