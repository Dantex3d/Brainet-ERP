{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Login - Brainet</title>
</head>
<body>

    <h1>Login</h1>

    <form method="post">
        {% csrf_token %}

        <p>
            <label>Username</label><br>
            {{ form.username }}
        </p>

        <p>
            <label>Password</label><br>
            {{ form.password }}
        </p>

        <button type="submit">Login</button>
    </form>

</body>
</html>
