{% extends 'dashboards/base.html' %}
{% load static %}

{% block content %}

<div class="container-fluid py-4">

    <div class="card border-0 shadow-lg rounded-4">

        <div class="card-header bg-warning text-dark">
            <h5 class="mb-0">Edit School</h5>
        </div>

        <div class="card-body">

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-bold">School Name</label>
                    <input type="text"
                           name="name"
                           value="{{ school.name }}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Email</label>
                    <input type="email"
                           name="email"
                           value="{{ school.email }}"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Phone</label>
                    <input type="text"
                           name="phone"
                           value="{{ school.phone }}"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Bank Name</label>
                    <input type="text"
                           name="bank_name"
                           value="{{ school.bank_name|default:'' }}"
                           class="form-control"
                           placeholder="e.g., ABC Bank">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Account Number</label>
                    <input type="text"
                           name="account_number"
                           value="{{ school.account_number|default:'' }}"
                           class="form-control"
                           placeholder="e.g., 1234567890">
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Update School
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
