<h2>Edit Teacher</h2>
<form method="post">
  {% csrf_token %}
  <label>Name:</label>
  <input type="text" name="name" value="{{ teacher.name }}" required><br><br>

  <label>Email:</label>
  <input type="email" name="email" value="{{ teacher.user.email }}" required><br><br>

  <label>Phone:</label>
  <input type="text" name="phone" value="{{ teacher.phone }}" required><br><br>

  <label>Role:</label>
  <select name="role" required>
    <option value="subject" {% if teacher.role == "subject" %}selected{% endif %}>Subject Teacher</option>
    <option value="class" {% if teacher.role == "class" %}selected{% endif %}>Class Teacher</option>
  </select><br><br>

  <!-- ✅ Class Assignment -->
  <label>Assigned Class (Optional):</label>
  <select name="assigned_class">
    <option value="">-- Select Class --</option>
    {% for class in classes %}
      <option value="{{ class.id }}" {% if class_assignment and class_assignment.class_obj.id == class.id %}selected{% endif %}>
        {{ class.name }}
      </option>
    {% endfor %}
  </select><br><br>
  <small>When a class is selected, Brainet will use or create the class's default stream automatically.</small><br><br>

  <button type="submit" class="btn btn-primary">Update</button>
</form>
