<form method="POST">
  {% csrf_token %}

  <select name="teacher">
    {% for t in teachers %}
      <option value="{{ t.id }}">{{ t.name }}</option>
    {% endfor %}
  </select>

  <select name="subject">
    {% for s in subjects %}
      <option value="{{ s.id }}">{{ s.name }}</option>
    {% endfor %}
  </select>

  <button type="submit">Assign</button>
</form>

{% if messages %}
  {% for message in messages %}
    <div class="message">
      {{ message }}
    </div>
  {% endfor %}
{% endif %}
